<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kurswechsel – Karrierecoaching</title>
  <meta name="description" content="Online-Karrierecoaching für deine berufliche Neuorientierung. Termine, Preise, Anmeldung.">
  <meta name="theme-color" content="#1A1A2E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kurswechsel">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="kopf">
    <div class="wrap">
      <p class="kopf-zusatz" id="zusatz"></p>
      <h1 id="titel">Kurswechsel</h1>
      <p class="kopf-spruch" id="spruch"></p>
    </div>
  </header>

  <main class="wrap inhalt">
    <p class="fehler" id="fehler" hidden>Die Inhalte laden gerade nicht. Versuch es gleich noch einmal.</p>

    <section class="naechster" id="naechster-bereich" aria-labelledby="naechster-label" hidden>
      <p class="label" id="naechster-label">Nächster Termin</p>
      <div id="naechster"></div>
    </section>

    <section aria-label="Angebote und Termine">
      <div class="filter" role="group" aria-label="Angebote filtern">
        <button type="button" data-filter="alle" aria-pressed="true">Alle</button>
        <button type="button" data-filter="einzel" aria-pressed="false">Einzelcoaching</button>
        <button type="button" data-filter="gruppe" aria-pressed="false">Gruppentermine</button>
      </div>
      <div class="liste" id="liste" aria-live="polite"></div>
    </section>

    <section class="ueber" id="ueber" hidden>
      <h2 class="abschnitt-titel">Über mich</h2>
      <h3 id="ueber-name"></h3>
      <div id="ueber-text"></div>
    </section>
  </main>

  <footer class="fuss">
    <div class="wrap">
      <p class="fuss-name" id="fuss-name">Kurswechsel</p>
      <a class="fuss-mail" id="fuss-mail" hidden></a>
      <p class="fuss-hinweis">Beispielseite aus einem Workshop. Preise und Termine sind Beispiele.</p>
    </div>
  </footer>

  <dialog class="dialog" id="anmeldung" aria-labelledby="anmeldung-titel">
    <form class="formular" id="anmeldung-formular" novalidate>
      <p class="label">Anmeldung</p>
      <h2 class="dialog-titel" id="anmeldung-titel"></h2>
      <p class="dialog-termin" id="anmeldung-termin"></p>

      <label for="feld-name">Name</label>
      <input id="feld-name" name="name" autocomplete="name" maxlength="100" required aria-describedby="fehler-name">
      <p class="feld-fehler" id="fehler-name" hidden></p>

      <label for="feld-email">E-Mail</label>
      <input id="feld-email" name="email" type="email" inputmode="email" autocomplete="email" maxlength="254" required aria-describedby="fehler-email">
      <p class="feld-fehler" id="fehler-email" hidden></p>

      <label for="feld-nachricht">Deine Frage oder Situation <span class="freiwillig">(freiwillig)</span></label>
      <textarea id="feld-nachricht" name="nachricht" rows="4" maxlength="1000" aria-describedby="fehler-nachricht"></textarea>
      <p class="feld-fehler" id="fehler-nachricht" hidden></p>

      <!-- Spam-Falle: für Menschen unsichtbar. Nicht entfernen. -->
      <div class="falle" aria-hidden="true">
        <label for="feld-webseite">Webseite</label>
        <input id="feld-webseite" name="webseite" tabindex="-1" autocomplete="off">
      </div>

      <p class="datenschutz">Ich nutze deine Angaben nur, um dich zu diesem Termin zu kontaktieren.</p>

      <div class="dialog-knoepfe">
        <button type="button" class="knopf knopf--leise" id="anmeldung-abbrechen" data-schliessen>Abbrechen</button>
        <button type="submit" class="knopf" id="anmeldung-senden">Anmelden</button>
      </div>
    </form>

    <div class="dialog-ergebnis" id="anmeldung-ergebnis" hidden>
      <p class="dialog-meldung" id="anmeldung-meldung" role="status"></p>
      <div class="dialog-knoepfe">
        <a class="knopf knopf--leise" id="anmeldung-mail" hidden>E-Mail schreiben</a>
        <button type="button" class="knopf" data-schliessen>Schließen</button>
      </div>
    </div>
  </dialog>
</body>
</html>
